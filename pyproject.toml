[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-rag"
version = "1.0.0"
description = "Subspace-Hardened Isolation and Ephemeral-Layer Decryption for Multi-Tenant Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Smit Bhavesh Trivedi", email = "smitbhavesh.trivedi2023@vitstudent.ac.in"},
    {name = "Thaker Nitya Ajit"},
    {name = "Khose Yash Ninad"},
    {name = "Dr. Konatham Sumalatha"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pycryptodome>=3.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "gmpy2>=2.1.5",
]

[project.scripts]
shield-rag-demo = "demo.run_demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
