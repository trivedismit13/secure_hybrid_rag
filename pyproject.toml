[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "shield-rag"
version = "0.1.0"
description = "Secure Hierarchical Intent-constrained Encrypted-graph Layered Deduction RAG"
requires-python = ">=3.11"
dependencies = [
    # Crypto
    "pycryptodome>=3.19",
    "gmpy2>=2.1",
    # ML / Embeddings
    "torch>=2.1",
    "transformers>=4.36",
    "sentence-transformers>=2.3",
    # API
    "fastapi>=0.109",
    "uvicorn>=0.25",
    # Data / Eval
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
